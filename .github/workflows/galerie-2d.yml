name: Galerie Studio Niko - sauvegarde 2D
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gallery-2d:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validation JSON et code de sauvegarde
        run: node tools/check-2d.cjs
      - name: Parcours Chromium restauration, IndexedDB et ergonomie 390px
        run: node tools/test-2d-backup.cjs
